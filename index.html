<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SecurePay — Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E1C36;
  --navy-2:#16294B;
  --navy-3:#22385F;
  --navy-tint:#EDF1FA;
  --ink:#101826;
  --muted:#6B7590;
  --muted-2:#98A0B8;
  --line:#E4E8F2;
  --bg:#EFF2F8;
  --white:#FFFFFF;
  --green:#1D9E6D;
  --green-tint:#E4F7EF;
  --green-line:#BEE9D5;
  --orange:#DB8A2E;
  --orange-tint:#FCF0DE;
  --orange-line:#F3D9A8;
  --red:#D6483F;
  --red-tint:#FBEAEA;
  --red-line:#F1C4C0;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:11px;
  --shadow-card:0 2px 10px rgba(14,28,54,.05), 0 1px 2px rgba(14,28,54,.04);
  --shadow-pop:0 20px 50px -12px rgba(10,20,40,.35);
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
}

/* ---------- Stage (desktop presentation backdrop) ---------- */
.stage{
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:26px;
  padding:48px 20px 64px;
  background:
    radial-gradient(circle at 12% 8%, rgba(14,28,54,.05), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(29,158,109,.06), transparent 40%),
    var(--bg);
  position:relative;
}
.stage-label{ text-align:center; max-width:420px; }
.stage-eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.14em;
  color:var(--muted);
  font-weight:600;
}
.stage-label h1{
  font-family:var(--font-display);
  font-size:30px;
  font-weight:700;
  color:var(--navy);
  margin:6px 0 4px;
  letter-spacing:-.01em;
}
.stage-label p{
  font-size:14px;
  color:var(--muted);
  margin:0;
}

.app-wrap{
  width:390px;
  height:844px;
  position:relative;
}
.phone{
  width:100%;
  height:100%;
  background:var(--white);
  border-radius:44px;
  box-shadow:var(--shadow-pop), 0 0 0 10px var(--navy), 0 0 0 12px rgba(14,28,54,.15);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  position:relative;
}
.notch{
  position:absolute;
  top:0; left:50%; transform:translateX(-50%);
  width:120px; height:26px;
  background:var(--navy);
  border-radius:0 0 16px 16px;
  z-index:50;
}

.statusbar{
  height:46px;
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 26px;
  font-family:var(--font-mono);
  font-size:13px;
  font-weight:600;
  color:var(--ink);
  background:var(--white);
  position:relative;
  z-index:10;
}
.statusbar .icons{display:flex; align-items:center; gap:5px;}
.statusbar svg{display:block;}

/* ---------- App header (per-screen) ---------- */
.appheader{
  min-height:52px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:2px 18px 14px;
  background:var(--white);
  border-bottom:1px solid transparent;
}
.appheader.bordered{border-bottom:1px solid var(--line);}
.back-btn{
  width:34px; height:34px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--white);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  flex:none;
  color:var(--navy);
}
.back-btn:active{background:var(--navy-tint);}
.appheader h2{
  font-family:var(--font-display);
  font-size:17px;
  font-weight:600;
  margin:0;
  color:var(--navy);
  letter-spacing:-.01em;
}

/* ---------- Scroll content ---------- */
.appcontent{
  flex:1;
  overflow-y:auto;
  background:var(--bg);
  -ms-overflow-style:none;
  scrollbar-width:none;
}
.appcontent::-webkit-scrollbar{display:none;}
.screen-pad{ padding:18px 18px 34px; }
.screen-flush{ padding:0 0 34px; }

/* ---------- Typography helpers ---------- */
h1.disp,h2.disp,h3.disp{ font-family:var(--font-display); color:var(--navy); letter-spacing:-.01em; margin:0; }
.eyebrow{
  font-family:var(--font-mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.1em;
  color:var(--muted);
  text-transform:uppercase;
}
.muted{ color:var(--muted); }
.small{ font-size:12.5px; }
.mono{ font-family:var(--font-mono); }
p{ line-height:1.5; }

/* ---------- Buttons ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%;
  padding:14px 18px;
  border-radius:14px;
  font-family:var(--font-body);
  font-weight:600;
  font-size:14.5px;
  border:none;
  cursor:pointer;
  transition:transform .06s ease, opacity .15s ease;
  text-align:center;
}
.btn:active{ transform:scale(.98); }
.btn-primary{ background:linear-gradient(155deg, var(--navy-2), var(--navy)); color:var(--white); box-shadow:0 6px 16px -6px rgba(14,28,54,.45); }
.btn-primary:hover{ background:linear-gradient(155deg, var(--navy-3), var(--navy-2)); }
.btn-secondary{ background:var(--white); color:var(--navy); border:1.5px solid var(--navy); }
.btn-ghost{ background:transparent; color:var(--navy); font-weight:600; padding:12px; }
.btn-danger-line{ background:var(--white); color:var(--red); border:1.5px solid var(--red-line); }
.btn-sm{ padding:9px 14px; font-size:13px; border-radius:11px; width:auto; }
.btn-block-row{ display:flex; gap:10px; }
.btn-block-row .btn{ flex:1; }

/* ---------- Cards ---------- */
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
  box-shadow:var(--shadow-card);
}
.card + .card{ margin-top:12px; }
.stack > * + *{ margin-top:12px; }
.card-accent{ border-left:4px solid var(--navy); }
.card-accent.risk-low{ border-left-color:var(--green); }
.card-accent.risk-moderate{ border-left-color:var(--orange); }
.card-accent.risk-high{ border-left-color:var(--red); }

/* ---------- Rows / fields ---------- */
.field{ margin-bottom:14px; }
.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:6px;
}
.input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1.5px solid var(--line);
  font-family:var(--font-body);
  font-size:14.5px;
  color:var(--ink);
  background:var(--white);
}
.input:focus{ outline:none; border-color:var(--navy-3); }
select.input{ appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%236B7590' stroke-width='1.6' fill='none'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; }

.kv-row{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  gap:12px;
}
.kv-row:last-child{ border-bottom:none; }
.kv-row .k{ font-size:13px; color:var(--muted); }
.kv-row .v{ font-size:13.5px; font-weight:600; color:var(--ink); text-align:right; font-family:var(--font-mono); }

/* ---------- Badges / pills ---------- */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  font-family:var(--font-mono);
}
.badge-dot{ width:7px; height:7px; border-radius:50%; }
.badge.risk-low{ background:var(--green-tint); color:var(--green); }
.badge.risk-low .badge-dot{ background:var(--green); }
.badge.risk-moderate{ background:var(--orange-tint); color:var(--orange); }
.badge.risk-moderate .badge-dot{ background:var(--orange); }
.badge.risk-high{ background:var(--red-tint); color:var(--red); }
.badge.risk-high .badge-dot{ background:var(--red); }
.badge.neutral{ background:var(--navy-tint); color:var(--navy); }
.badge.neutral .badge-dot{ background:var(--navy); }

.risk-score-block{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px;
  border-radius:14px;
}
.risk-score-block.risk-low{ background:var(--green-tint); }
.risk-score-block.risk-moderate{ background:var(--orange-tint); }
.risk-score-block.risk-high{ background:var(--red-tint); }
.risk-score-block .num{ font-family:var(--font-mono); font-size:26px; font-weight:600; }
.risk-score-block.risk-low .num{ color:var(--green); }
.risk-score-block.risk-moderate .num{ color:var(--orange); }
.risk-score-block.risk-high .num{ color:var(--red); }

/* ---------- Summary tiles (dashboard) ---------- */
.tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:14px;
  box-shadow:0 2px 8px rgba(14,28,54,.04);
}
.tile .tile-ic{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
.tile .tile-num{ font-family:var(--font-mono); font-size:24px; font-weight:600; color:var(--navy); }
.tile .tile-label{ font-size:12px; color:var(--muted); margin-top:2px; }

/* ---------- Toggle switch ---------- */
.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
.toggle-row:last-child{ border-bottom:none; }
.toggle-row .lbl{ font-size:13.5px; color:var(--ink); line-height:1.4; }
.switch{ width:44px; height:26px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; flex:none; transition:background .15s ease; }
.switch::after{ content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--white); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .15s ease; }
.switch.on{ background:var(--navy); }
.switch.on::after{ transform:translateX(18px); }

/* ---------- OTP / verification dots ---------- */
.otp-row{ display:flex; gap:9px; justify-content:center; margin:22px 0 6px; }
.otp-box{
  width:44px; height:52px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:var(--white);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono);
  font-size:20px; font-weight:600;
  color:var(--navy);
}
.dots-row{ display:flex; gap:11px; justify-content:center; margin:22px 0 6px; }
.dot-box{ width:16px; height:16px; border-radius:50%; background:var(--navy); }

/* ---------- Landing ---------- */
.landing{
  height:100%;
  display:flex;
  flex-direction:column;
  background:linear-gradient(165deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
  color:var(--white);
  padding:0 26px 34px;
  position:relative;
  overflow:hidden;
}

/* ---- decorative backdrop: dot grid + soft colour blobs ---- */
.landing::before{
  content:'';
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.14) 1px, transparent 1.4px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 100% 60% at 50% 30%, #000 40%, transparent 78%);
          mask-image:radial-gradient(ellipse 100% 60% at 50% 30%, #000 40%, transparent 78%);
  z-index:0;
  pointer-events:none;
}
.blob{ position:absolute; border-radius:50%; filter:blur(46px); z-index:0; pointer-events:none; }
.blob-green{ width:190px; height:190px; background:var(--green); opacity:.20; top:-40px; right:-60px; }
.blob-orange{ width:170px; height:170px; background:var(--orange); opacity:.16; bottom:70px; left:-70px; }

.landing-top{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; z-index:2; }
.landing-actions{ position:relative; z-index:2; }

/* ---- hero illustration: freelancer at work + floating data/skill chips ---- */
.hero-illustration{
  position:relative;
  width:250px; height:186px;
  display:flex; align-items:center; justify-content:center;
  margin-bottom:18px;
}
.hero-illustration svg{ position:relative; z-index:1; overflow:visible; }
.hero-chip{
  position:absolute;
  background:var(--white);
  color:var(--ink);
  border-radius:13px;
  padding:8px 11px;
  display:flex; align-items:center; gap:7px;
  font-size:11px; font-weight:700;
  box-shadow:0 14px 28px rgba(0,0,0,.28);
  z-index:4;
  white-space:nowrap;
}
.hero-chip .chip-ic{ width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
.hero-chip-verified{ top:2px; right:-6px; transform:rotate(-5deg); }
.hero-chip-verified .chip-ic{ background:var(--green-tint); color:var(--green); }
.hero-chip-bank{ bottom:10px; left:-10px; transform:rotate(4deg); }
.hero-chip-bank .chip-ic{ background:var(--navy-tint); color:var(--navy-3); }
.hero-chip .chip-sub{ font-weight:500; color:var(--muted); font-size:10px; }

.hero-chip-icon{
  position:absolute;
  width:34px; height:34px;
  border-radius:50%;
  background:var(--white);
  color:var(--navy-3);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 22px rgba(0,0,0,.25);
  z-index:4;
}
.hero-chip-camera{ top:6px; left:2px; }
.hero-chip-spark{ bottom:30px; right:0; color:var(--orange); }

@media (prefers-reduced-motion: no-preference){
  .hero-chip-verified{ animation:floatA 4.2s ease-in-out infinite; }
  .hero-chip-bank{ animation:floatB 4.8s ease-in-out infinite; animation-delay:.5s; }
  .hero-chip-camera{ animation:floatB 5.2s ease-in-out infinite; animation-delay:.2s; }
  .hero-chip-spark{ animation:floatA 4.6s ease-in-out infinite; animation-delay:.9s; }
}
@keyframes radarPulse{
  0%{ transform:scale(.85); opacity:.55; }
  75%{ opacity:0; }
  100%{ transform:scale(1.9); opacity:0; }
}
@keyframes floatA{
  0%,100%{ transform:translateY(0) rotate(-5deg); }
  50%{ transform:translateY(-9px) rotate(-3deg); }
}
@keyframes floatB{
  0%,100%{ transform:translateY(0) rotate(4deg); }
  50%{ transform:translateY(-7px) rotate(6deg); }
}

.landing h1{
  font-family:var(--font-display);
  font-size:32px;
  font-weight:700;
  letter-spacing:-.02em;
  margin:0 0 8px;
}
.landing .tag{
  font-size:14.5px;
  color:rgba(255,255,255,.72);
  margin:0;
}
.landing-actions{ display:flex; flex-direction:column; gap:10px; }
.landing .btn-primary{ background:var(--white); color:var(--navy); }
.landing .btn-secondary{ background:transparent; color:var(--white); border:1.5px solid rgba(255,255,255,.4); }
.landing .btn-singpass{ background:#EF3E36; color:var(--white); }
.landing-foot{ text-align:center; font-size:11px; color:rgba(255,255,255,.45); margin-top:16px; font-family:var(--font-mono); letter-spacing:.04em;}

/* ---------- Dashboard header ---------- */
.dash-head{
  background:linear-gradient(160deg, var(--navy), var(--navy-3));
  color:var(--white);
  padding:18px 18px 22px;
  border-radius:0 0 24px 24px;
  position:relative;
  overflow:hidden;
}
.dash-head-pattern{
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.4px);
  background-size:18px 18px;
  -webkit-mask-image:linear-gradient(200deg, #000 10%, transparent 62%);
          mask-image:linear-gradient(200deg, #000 10%, transparent 62%);
  pointer-events:none;
}
.dash-head-row{ position:relative; z-index:1; }
.dash-head .hello{ font-family:var(--font-display); font-size:21px; font-weight:600; margin:0 0 3px; }
.dash-head .sub{ font-size:13px; color:rgba(255,255,255,.68); margin:0; }
.dash-head-row{ display:flex; align-items:center; justify-content:space-between; }
.avatar-ring{ width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:15px; }

.section-title{ font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--navy); margin:22px 0 10px; display:flex; align-items:center; gap:8px; justify-content:space-between; }

/* ---------- Dashboard tab switch (Alerts / Recent Invoices) ---------- */
.tab-switch{
  display:flex;
  background:var(--navy-tint);
  border-radius:12px;
  padding:4px;
  gap:4px;
}
.tab-btn{
  flex:1;
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 6px;
  border-radius:9px;
  font-size:12.5px;
  font-weight:600;
  color:var(--muted);
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
.tab-btn.active{
  background:var(--white);
  color:var(--navy);
  box-shadow:0 2px 6px rgba(14,28,54,.1);
}
.tab-btn .tab-count{
  background:var(--red);
  color:var(--white);
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:700;
  min-width:16px;
  height:16px;
  border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  padding:0 3px;
}
.section-title .st-left{ display:flex; align-items:center; gap:8px; }
.section-title .st-ic{ width:26px; height:26px; border-radius:8px; background:var(--navy-tint); color:var(--navy-3); display:flex; align-items:center; justify-content:center; flex:none; }
.section-title .link{ font-family:var(--font-body); font-size:12.5px; font-weight:600; color:var(--navy-3); cursor:pointer; }

/* ---------- Icon lead-in for form-style screens ---------- */
.screen-lead{ display:flex; align-items:center; gap:12px; margin:2px 0 18px; }
.screen-lead-ic{
  width:44px; height:44px; border-radius:13px; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--navy-tint); color:var(--navy-3);
  box-shadow:0 3px 8px rgba(14,28,54,.06);
}
.screen-lead h3{ font-family:var(--font-display); font-size:15.5px; font-weight:600; color:var(--navy); margin:0; }
.screen-lead p{ font-size:12.5px; color:var(--muted); margin:2px 0 0; }

.invoice-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.invoice-row .name{ font-weight:600; font-size:14px; color:var(--ink); }
.invoice-row .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
.invoice-row .amt{ font-family:var(--font-mono); font-weight:600; font-size:14.5px; }

.alert-card{ display:flex; gap:12px; align-items:flex-start; }
.alert-card{ cursor:pointer; transition:transform .08s ease; }
.alert-card:active{ transform:scale(.985); }
.alert-icon{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
.alert-icon.risk-moderate{ background:var(--orange-tint); }
.alert-icon.risk-high{ background:var(--red-tint); }
.alert-icon.risk-low{ background:var(--green-tint); }
.alert-title{ font-weight:600; font-size:13.5px; color:var(--ink); margin:0 0 3px; }
.alert-msg{ font-size:12.5px; color:var(--muted); margin:0; line-height:1.45; }

/* ---------- Checklist ---------- */
.check-item{ display:flex; align-items:flex-start; gap:9px; padding:7px 0; font-size:13px; color:var(--ink); }
.check-item svg{ flex:none; margin-top:1px; }
.risk-check-row{ display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px dashed var(--line); }
.risk-check-row:last-of-type{ border-bottom:none; }
.risk-check-row .pts{ font-family:var(--font-mono); font-weight:600; }

/* ---------- Info / notice boxes ---------- */
.notice{
  border-radius:14px;
  padding:13px 14px;
  font-size:12.5px;
  line-height:1.5;
  display:flex; gap:10px; align-items:flex-start;
}
.notice.info{ background:var(--navy-tint); color:var(--navy-2); }
.notice.warn{ background:var(--orange-tint); color:#8A5A17; }
.notice.danger{ background:var(--red-tint); color:#992D26; }
.notice svg{ flex:none; margin-top:1px; }

/* ---------- Checkbox row ---------- */
.check-row{ display:flex; align-items:flex-start; gap:10px; font-size:12px; color:var(--muted); line-height:1.5; padding:6px 0 18px; }
.check-box{ width:18px; height:18px; border-radius:5px; background:var(--navy); display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px; }

/* ---------- Radio-style bank list ---------- */
.bank-option{ display:flex; align-items:center; gap:12px; padding:13px 14px; border:1.5px solid var(--line); border-radius:13px; margin-bottom:9px; cursor:pointer; transition:transform .08s ease, border-color .12s ease; }
.bank-option:active{ transform:scale(.99); }
.bank-option.selected{ border-color:var(--navy); background:var(--navy-tint); }
.bank-option .radio{ width:19px; height:19px; border-radius:50%; border:2px solid var(--muted-2); flex:none; display:flex; align-items:center; justify-content:center; }
.bank-option.selected .radio{ border-color:var(--navy); }
.bank-option.selected .radio::after{ content:''; width:10px; height:10px; border-radius:50%; background:var(--navy); }
.bank-option .bname{ font-weight:600; font-size:14px; }

/* ---------- Subscription card ---------- */
.sub-card{ background:linear-gradient(150deg, var(--navy), var(--navy-3)); color:var(--white); border-radius:16px; padding:16px; }
.sub-card .price{ font-family:var(--font-mono); font-size:20px; font-weight:600; }
.sub-card .desc{ font-size:12.5px; color:rgba(255,255,255,.72); margin:4px 0 12px; }
.sub-card .btn{ background:var(--white); color:var(--navy); }

/* ---------- Success / decision block ---------- */
.decision-hero{ text-align:center; padding:22px 10px 6px; }
.decision-icon{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; box-shadow:0 0 0 8px rgba(14,28,54,.03); }
.decision-icon.risk-low{ background:var(--green-tint); box-shadow:0 0 0 8px rgba(29,158,109,.06); }
.decision-icon.risk-moderate{ background:var(--orange-tint); box-shadow:0 0 0 8px rgba(219,138,46,.07); }
.decision-icon.risk-high{ background:var(--red-tint); box-shadow:0 0 0 8px rgba(214,72,63,.07); }
.decision-icon.neutral{ background:var(--navy-tint); }
.decision-hero h2{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--navy); margin:0 0 4px; }
.decision-hero p{ font-size:13px; color:var(--muted); margin:0; }

/* ---------- Modal / popup ---------- */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,18,36,.55);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:1000;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal-sheet{
  width:100%;
  max-width:390px;
  background:var(--white);
  border-radius:26px 26px 0 0;
  padding:22px 20px 26px;
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
  position:relative;
}
@keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.modal-grabber{ width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 16px; }
.modal-icon{ width:54px; height:54px; border-radius:16px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; box-shadow:0 0 0 8px rgba(0,0,0,.02); }
.modal-icon.risk-moderate{ background:var(--orange-tint); }
.modal-icon.risk-high{ background:var(--red-tint); }
.modal-icon.risk-low{ background:var(--green-tint); }
.modal-sheet h3{ font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--navy); margin:0 0 6px; }
.modal-sheet p{ font-size:13.5px; color:var(--ink); margin:0 0 14px; }

/* ---------- Toast ---------- */
.toast{
  position:absolute;
  bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--navy); color:var(--white);
  padding:11px 18px; border-radius:99px;
  font-size:12.5px; font-weight:600;
  box-shadow:var(--shadow-pop);
  z-index:1200;
  display:flex; align-items:center; gap:8px;
  animation:toastIn .2s ease;
  white-space:nowrap;
}
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }

/* ---------- Restart button ---------- */
.restart-btn{
  font-family:var(--font-body);
  font-size:12.5px; font-weight:600;
  color:var(--navy);
  background:var(--white);
  border:1px solid var(--line);
  padding:9px 16px;
  border-radius:99px;
  cursor:pointer;
  box-shadow:var(--shadow-card);
  display:flex; align-items:center; gap:6px;
}
.restart-btn:hover{ background:var(--navy-tint); }

/* ---------- Divider ---------- */
.divider-text{ display:flex; align-items:center; gap:10px; color:var(--muted-2); font-size:11.5px; margin:16px 0; }
.divider-text::before,.divider-text::after{ content:''; flex:1; height:1px; background:var(--line); }

/* ---------- Singpass-style verification panel (generic mock, not the real logo) ---------- */
.sp-panel{

  border-radius:20px;
  padding:26px 20px 22px;
  color:#fff;
  text-align:center;
}
.sp-panel::before{
  content:'';
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.4px);
  background-size:16px 16px;
  pointer-events:none;
}
.sp-scan-wrap{
  position:relative;
  width:76px; height:76px;
  margin:2px auto 12px;
  display:flex; align-items:center; justify-content:center;
}
.sp-ring{
  position:absolute;

  text-transform:uppercase;
  position:relative; z-index:1;
}
.sp-sub{

  position:relative; z-index:1;
}
.sp-idcard{
  margin-top:16px;

  border-radius:13px;
  padding:12px 14px;
  text-align:left;
  position:relative; z-index:1;
}
.sp-idcard .row{ display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px; }
.sp-idcard .row .k{ color:rgba(255,255,255,.65); }
.sp-idcard .row .v{ font-weight:600; font-family:var(--font-mono); }
.sp-disclaimer{
  margin-top:14px;
  font-size:10.5px;
  line-height:1.5;
  color:var(--muted-2);
  text-align:center;
  padding:0 6px;
}

/* ---------- Numeric keypad (Singpass passcode screen) ---------- */
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:16px 0 20px;
}
.keypad-key{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 0 9px;
  text-align:center;
  font-family:var(--font-mono);
  font-weight:600;
  font-size:19px;
  color:var(--ink);
  transition:transform .08s ease, background .1s ease;
}
.keypad-key:active{ transform:scale(.94); background:var(--navy-tint); }
.keypad-key .sub{
  display:block;
  font-family:var(--font-body);
  font-weight:600;
  font-size:8px;
  letter-spacing:.08em;
  color:var(--muted);
  margin-top:2px;
}
.keypad-key.empty{ visibility:hidden; }
.keypad-key.backspace{ display:flex; align-items:center; justify-content:center; color:var(--navy-3); }

/* ---------- Face liveness check (Singpass face verification screen) ---------- */
.face-scan-wrap{
  position:relative;
  width:132px; height:132px;
  margin:6px auto 22px;
  display:flex; align-items:center; justify-content:center;
}
.face-spinner{
  position:absolute;
  width:112px; height:112px;
  border-radius:50%;
  border:3px solid var(--line);
  border-top-color:var(--navy-3);
}
@media (prefers-reduced-motion: no-preference){
  .face-spinner{ animation:spin .9s linear infinite; }
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.face-icon-wrap{
  position:relative; z-index:2;
  width:82px; height:82px;
  border-radius:50%;
  background:var(--navy-tint);
  color:var(--navy-3);
  display:flex; align-items:center; justify-content:center;
  transition:background .3s ease, color .3s ease;
}

/* ---------- Responsive: real mobile becomes full app ---------- */
@media (max-width: 480px){

  .notch{ display:none; }
  .restart-btn{ position:fixed; top:10px; right:10px; z-index:1300; opacity:.85; padding:7px 12px; font-size:11px;}
}

    </div>
  </div>

/* Renders whichever outcome the face scan reaches — success (leads to dashboard/identity
   verified) or failure (falls back to Singpass passcode entry). */
function renderFaceScanOutcome(myMount, outcome){
  if (faceScanMountId !== myMount) return; // user navigated away or a newer scan started
  const iconWrap = document.getElementById("faceIconWrap");
  if (!iconWrap) return;
  document.getElementById("faceSpinner").style.display = "none";
  const statusText = document.getElementById("faceStatusText");
  const resultWrap = document.getElementById("faceResultWrap");

  if (outcome === "success") {
    iconWrap.style.background = "var(--green-tint)";
    iconWrap.style.color = "var(--green)";
    statusText.textContent = "Face verified";
    resultWrap.innerHTML = `
      ${notice("info", ICON.check, "Your identity has been confirmed via facial recognition.")}
      <div style="margin-top:14px">${btn("Continue", "go(SINGPASS_NEXT)", "primary")}</div>
    `;
  } else {
    iconWrap.style.background = "var(--red-tint)";
    iconWrap.style.color = "var(--red)";
    statusText.textContent = "Face recognition unsuccessful";
    resultWrap.innerHTML = `
      ${notice("danger", ICON.alertOctagon(16), "We couldn't verify your face. You can log in with your Singpass passcode instead.")}
      <div style="margin-top:14px">${btn("Enter Passcode", "go('singpassPasscode')", "primary")}</div>
    `;
  }

  resultWrap.style.display = "";
  resultWrap.style.opacity = "0";
  const reveal = () => {
    resultWrap.style.transition = "opacity .3s ease";
    resultWrap.style.opacity = "1";
  };
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(reveal);
  else reveal();
}

/* Lets the demo link jump straight to the failure outcome, cancelling the pending
   automatic success by invalidating the current mount id. */
function forceFaceScanFail(){
  faceScanMountId++;
  renderFaceScanOutcome(faceScanMountId, "fail");
}

/* Runs once each time the face scan screen mounts. By default, resolves to success
   after a short delay (biometric-only login, no passcode needed) unless the demo
   link above has already forced a failure first. */
let faceScanMountId = 0;
SCREEN_MOUNT.singpassFaceScan = function(){
  faceScanMountId++;
  const myMount = faceScanMountId;
  setTimeout(() => { renderFaceScanOutcome(myMount, "success"); }, 1800);
};

const ALERT_ICON = {
  underpay:{icon:ICON.alertTriangle(20), level:"moderate"},
  overpay:{icon:ICON.alertTriangle(20), level:"moderate"},
  overdue:{icon:ICON.clock(20), level:"moderate"},
  local_mismatch:{icon:ICON.alertTriangle(20), level:"moderate"},
  suspicious:{icon:ICON.alertOctagon(20), level:"high"}
};
const ALERT_MODAL = { underpay:"underpayment", overpay:"overpayment", overdue:"overdue", local_mismatch:"localMismatch", suspicious:"suspicious" };
const ALERT_DETAIL_SCREEN = { underpay:"underpaymentDetails", overpay:"overpaymentDetails", overdue:"overdueDetails", local_mismatch:"localMismatchDetails", suspicious:"suspiciousDetails" };

/* Alerts are shown most-urgent-first, not in data-entry order, so the freelancer
   always sees the thing that needs their attention most at the top of the list. */
function sortedAlerts(){
  return DATA.alerts.slice().sort((a,b) => b.score - a.score);
}

function alertCard(a, clickable=true){
  const meta = ALERT_ICON[a.type];
  return `
    <div class="card alert-card" ${clickable?`style="cursor:pointer" onclick="openModal('${ALERT_MODAL[a.type]}')"`:""}>
      <div class="alert-icon risk-${meta.level}" style="color:var(--${meta.level==='high'?'red':'orange'})">${meta.icon}</div>
      <div style="flex:1">
        <p class="alert-title">${a.title}</p>
        <p class="alert-msg">${a.msg}</p>
      </div>
      ${btn("View", `openModal('${ALERT_MODAL[a.type]}')`, "secondary", "btn-sm")}
    </div>
  `;
}

/* =========================================================
   Modal popups (risk alerts)
   ========================================================= */
function renderModal(){
  const root = document.getElementById("modalroot");
  if(!APP.modal){ root.innerHTML = ""; return; }
  root.innerHTML = MODALS[APP.modal]();
}

const MODALS = {
  underpayment: () => `
    <div class="modal-overlay" onclick="if(event.target===this) dismissAlert()">
      <div class="modal-sheet">
        <div class="modal-grabber"></div>
        <div class="modal-icon risk-moderate" style="color:var(--orange)">${ICON.alertTriangle(26)}</div>
        <h3>Payment Amount Mismatch</h3>

        ${card(`${kv("Outstanding Amount", money(200))}`)}

  `,
  overpayment: () => `
